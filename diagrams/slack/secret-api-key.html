<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Message - Secret API Key</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
          "Ubuntu", "Cantarell", sans-serif;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
      }

      .channel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        border-bottom: 1px solid #e0e0e0;
      }

      .channel-name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        font-weight: 700;
        color: #1d1c1d;
      }

      .lock-icon {
        width: 16px;
        height: 16px;
        color: #616061;
      }

      .dropdown-icon {
        width: 16px;
        height: 16px;
        color: #1d1c1d;
      }

      .member-avatars {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .avatars {
        display: flex;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 4px;
        border: 2px solid #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        color: #fff;
      }

      .member-count {
        font-size: 14px;
        color: #616061;
        padding: 4px 12px;
        background: #f8f8f8;
        border-radius: 4px;
        border: 1px solid #e0e0e0;
      }

      .tabs {
        display: flex;
        gap: 8px;
        padding: 4px 20px;
        border-bottom: 1px solid #e0e0e0;
        margin-bottom: 20px;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 14px;
        color: #616061;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
      }

      .tab:hover {
        background: #f8f8f8;
        border-radius: 6px 6px 0 0;
      }

      .tab-icon {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .plus-tab {
        margin-left: auto;
        color: #1d1c1d;
        font-size: 18px;
        padding: 8px 12px;
        cursor: pointer;
      }

      .plus-tab:hover {
        background: #f8f8f8;
        border-radius: 6px;
      }

      .message {
        display: flex;
        gap: 12px;
        padding: 8px 20px;
        transition: background 0.1s;
      }

      .message:hover {
        background: #f8f8f8;
      }

      .message-avatar {
        width: 36px;
        height: 36px;
        border-radius: 4px;
        flex-shrink: 0;
        background: #e01e5a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 18px;
        color: #fff;
      }

      .message-content {
        flex: 1;
      }

      .message-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 4px;
      }

      .message-author {
        font-weight: 700;
        color: #1d1c1d;
        font-size: 15px;
      }

      .message-time {
        font-size: 12px;
        color: #616061;
      }

      .message-text {
        color: #1d1c1d;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="channel-header">
        <div class="channel-name">
          <svg class="lock-icon" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"
            />
          </svg>
          <span>secret-api-key</span>
          <svg class="dropdown-icon" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M4.427 7.427l3.396 3.396a.25.25 0 00.354 0l3.396-3.396A.25.25 0 0011.396 7H4.604a.25.25 0 00-.177.427z"
            />
          </svg>
        </div>
        <div class="member-avatars">
          <div class="avatars">
            <div class="avatar" style="background: #36c5f0">U</div>
          </div>
          <div class="member-count">1</div>
        </div>
      </div>

      <div class="tabs">
        <div class="tab">
          <svg class="tab-icon" viewBox="0 0 24 24">
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            ></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Project brief</span>
        </div>
        <div class="tab">
          <svg class="tab-icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Resources</span>
        </div>
        <div class="tab">
          <svg class="tab-icon" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>To do</span>
        </div>
        <div class="tab">
          <svg class="tab-icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          <span>Jira board</span>
        </div>
        <div class="plus-tab">+</div>
      </div>

      <div class="message">
        <div class="message-avatar" style="background: #36c5f0">U</div>
        <div class="message-content">
          <div class="message-header">
            <span class="message-author">User</span>
            <span class="message-time">9:08</span>
          </div>
          <div class="message-text">
            EldritchNexus API key: hj0she0132456789
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
